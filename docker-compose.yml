# ---------------------------------------------------------------------
#  Reflex chatbot — single compose file, optional services via profiles
#
#  LLM on the host (Ollama / LM Studio / llama.cpp / OmniRoute) or OpenRouter:
#     docker compose up -d
#
#  With Ollama inside compose (CPU), pulls OLLAMA_PULL_MODELS on start:
#     docker compose --profile ollama up -d
#
#  With Ollama on an NVIDIA GPU (requires nvidia-container-toolkit):
#     docker compose --profile ollama-gpu up -d
#
#  Profiles can also be set in .env:  COMPOSE_PROFILES=ollama
#  `docker compose up` pulls the published image; add --build to build it
#  from this checkout instead. See docs/DOCKER.md.
# ---------------------------------------------------------------------
name: reflex-chatbot

x-ollama: &ollama
  image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
  restart: unless-stopped
  volumes:
    - ollama-models:/root/.ollama
  ports:
    - "${OLLAMA_PORT:-11434}:11434"
  environment:
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  chatbot:
    image: ${DOCKERHUB_USER:-ecrespo}/reflex-chatbot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reflex-chatbot
    restart: unless-stopped
    ports:
      # Frontend and backend share one port. Keep the same number on both
      # sides or set REFLEX_API_URL (see docs/DOCKER.md).
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3000}
      REFLEX_API_URL: ${REFLEX_API_URL:-}
      # Inside the container `localhost` is the container itself: servers
      # running on your machine are reached through host.docker.internal.
      # Empty OLLAMA_BASE_URL = auto: http://ollama:11434/v1 when an `ollama`
      # profile is active, the host's Ollama otherwise (docker-entrypoint.sh).
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-}
      LMSTUDIO_BASE_URL: ${DOCKER_LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LLAMACPP_BASE_URL: ${DOCKER_LLAMACPP_BASE_URL:-http://host.docker.internal:8080/v1}
      OMNIROUTE_BASE_URL: ${DOCKER_OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}
    extra_hosts:
      # Linux: makes host.docker.internal point at the host
      - "host.docker.internal:host-gateway"
    depends_on:
      # Only waited for when the matching profile is active.
      ollama:
        condition: service_healthy
        required: false
      ollama-gpu:
        condition: service_healthy
        required: false

  # --- profile: ollama -------------------------------------------------
  ollama:
    <<: *ollama
    profiles: [ollama]
    container_name: reflex-chatbot-ollama

  # --- profile: ollama-gpu (NVIDIA) -------------------------------------
  # AMD ROCm: use the `ollama` profile with OLLAMA_IMAGE_TAG=rocm and add
  #   devices: ["/dev/kfd", "/dev/dri"]   to the `ollama` service.
  ollama-gpu:
    <<: *ollama
    profiles: [ollama-gpu]
    container_name: reflex-chatbot-ollama
    networks:
      default:
        # Same DNS name as the CPU service, so the chatbot needs no changes.
        aliases: [ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot job: pulls the model(s) the chatbot expects, then exits.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    profiles: [ollama, ollama-gpu]
    container_name: reflex-chatbot-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      ollama-gpu:
        condition: service_healthy
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Space-separated list; defaults to OLLAMA_MODEL from .env
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-${OLLAMA_MODEL:-llama3.2}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for model in $${OLLAMA_PULL_MODELS}; do
          echo "pulling $$model"; ollama pull "$$model" || exit 1
        done
    restart: "no"

volumes:
  ollama-models:
