[project]
name = "chatbot"
version = "0.1.0"
description = "Reflex chatbot (reflex-assistant-ui) for Ollama, LM Studio, llama.cpp, OpenRouter and OmniRoute"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "reflex>=0.9.12",
    "reflex-assistant-ui>=0.1.0",
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
