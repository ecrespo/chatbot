name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff check
        run: uvx ruff check --output-format=github .
      - name: ruff format
        run: uvx ruff format --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Install
        run: uv sync --locked
      - name: pytest
        run: uv run pytest -q

  package:
    name: PyPI package (build, install, compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sdist and wheel
        run: uv build
      - name: twine check
        run: uvx twine check --strict dist/*
      - name: Wheel ships the app template
        run: |
          contents=$(python -m zipfile -l dist/*.whl)
          for f in reflex_chatbot/cli.py reflex_chatbot/_app/rxconfig.py reflex_chatbot/_app/env.example reflex_chatbot/_app/assets/favicon.ico; do
            echo "$contents" | grep -q "$f" || { echo "::error::missing $f in wheel"; exit 1; }
          done
      - name: Install the wheel in a clean env and compile the app
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/reflex-chatbot --version
          /tmp/wheel-env/bin/reflex-chatbot init /tmp/app
          cd /tmp/app
          REFLEX_TELEMETRY_ENABLED=false /tmp/wheel-env/bin/reflex export --frontend-only --no-zip --loglevel info

  compose:
    name: docker compose profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate every profile
        run: |
          check() {
            local profiles="$1" expected="$2" got
            got=$(COMPOSE_PROFILES="$profiles" docker compose --env-file .env.example config --services | sort | xargs)
            echo "profile='${profiles}': ${got}"
            [ "$got" = "$expected" ] || { echo "::error::profile '${profiles}' expected '${expected}'"; exit 1; }
          }
          check ""           "chatbot"
          check "ollama"     "chatbot ollama ollama-pull"
          check "ollama-gpu" "chatbot ollama-gpu ollama-pull"

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: reflex-chatbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container answers /ping
        run: |
          docker run -d --name chatbot -p 3000:3000 reflex-chatbot:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/ping && exit 0
            sleep 3
          done
          docker logs chatbot
          exit 1
